<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <link rel="stylesheet" href="/assets/css/register.css">
    <link rel="shortcut icon"  type="image/png" href="/assets/Picture/Favicone.png">
</head>

<body>



    <div class="register-container">
        
        <img
        id="logo"
        src="/assets/Picture/Wow-icone.png" />
        
        <h2>Inscription</h2>

            <form class="register-link" action="/auth/register" method="post">
                {{with .Error}}
                <div class="form-error">{{.}}</div>
                {{end}}
                {{with .Message}}
                <div class="form-success">{{.}}</div>
                {{end}}

                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Votre username">
                
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" placeholder="exemple@mail.com" required>

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>

                <button type="submit">Créer un compte</button>

                <p class="register-link">
                Déja un compte ? <a href="/login" id="login_acc">Se connecter</a>
                </p>

                
            </form>
        </div>
 
</body>

</html>
