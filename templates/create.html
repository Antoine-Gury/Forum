<!DOCTYPE html>
<html>
<head>
    <title>Nouvelle discussion</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header>
    <h1>Nouvelle discussion</h1>
</header>

<nav>
    <a href="/">Accueil</a> | <a href="/profil">Profil</a>
</nav>

<main>
    <section class="form-card">
        <h2>Créer une nouvelle discussion</h2>
        <form action="/create" method="POST">
            <label for="author">Pseudo</label>
            <input id="author" name="author" placeholder="Ton pseudo" required>

            <label for="title">Titre</label>
            <input id="title" name="title" placeholder="Titre de la discussion" required>

            <label for="content">Message</label>
            <textarea id="content" name="content" placeholder="Écris ton message ici" rows="6" required></textarea>

            <button type="submit">Publier</button>
        </form>
    </section>
</main>

</body>
</html>
