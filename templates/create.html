<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle discussion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/index.css">
    <link rel="shortcut icon"  type="image/png" href="/assets/Picture/Favicone.png">
</head>
<body>

<header>
    <div class="logo">Forum WoW</div>
    <div class="tagline">Discussions de la communauté</div>
</header>

<nav class="main-nav">
    <button id="homeButton" class="Accueil-button" type="button">Accueil</button>
    <button id="NewDiscussionButton" class="Nouvelle-discussion-button" type="button">Nouvelle discussion</button>
    <button id="profileButton" class="Profil-button nav-right" type="button">Profil</button>
</nav>

<main>
    <section class="form-card">
        <h2>Créer une nouvelle discussion</h2>

        {{if .Error}}
        <p class="error">{{.Error}}</p>
        {{end}}

        <form action="/create" method="POST">
            {{if .Author}}
            <p class="author-info">Posté en tant que : <strong>{{.Author}}</strong></p>
            {{end}}

            <label for="title">Titre</label>
            <input id="title" name="title" placeholder="Titre de la discussion" required>

            <label for="content">Message</label>
            <textarea id="content" name="content" placeholder="Écris ton message ici" rows="6" required></textarea>

            <button type="submit">Publier</button>
        </form>
    </div>

</main>

<script src="/src/js/button.js"></script>
<script src="/src/js/live.js"></script>
</body>
</html>
