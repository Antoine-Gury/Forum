<!DOCTYPE html>
<html>
<head>
    <title>Créer</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<h1>Créer une discussion</h1>

<a href="/">Retour</a>

<form method="POST">
    {{ with .Error }}
    <div style="color:red; margin-bottom: 10px;">{{ . }}</div>
    {{ end }}
    <input name="title" placeholder="Titre"><br><br>
    <textarea name="content" placeholder="Message"></textarea><br><br>
    <button type="submit">Publier</button>
</form>

</body>
</html>
