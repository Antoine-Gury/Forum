<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum WoW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/index.css">
    <link rel="stylesheet" href="/assets/css/Avatar.css">
    <link rel="stylesheet" href="/assets/css/vote.css">
    <link rel="shortcut icon" type="image/png" href="/assets/Picture/Favicone.png">
</head>
<body>

<header>
    <div class="logo">Forum WoW</div>
    <div class="tagline">Discussions de la communauté</div>
</header>

<nav class="main-nav">
    <button id="homeButton" class="Accueil-button" type="button">Accueil</button>
    <button id="NewDiscussionButton" class="Nouvelle-discussion-button" type="button">Nouvelle discussion</button>
    <button id="profileButton" class="Profil-button nav-right" type="button">Profil</button>
</nav>

<main>
    <div class="section-title">Discussions récentes</div>
    
    <div class="filters">
        <label for="sort-filter">Trier par:</label>
        <select id="sort-filter">
            <option value="likes">Plus aimées</option>
            <option value="recent">Plus récentes</option>
        </select>
    </div>

    {{if .Message}}
    <div class="home-message">{{.Message}}</div>
    {{end}}

    <div id="discussions-list">
        {{range .Discussions}}
        <div class="post" data-score="{{.Score}}" data-created="{{.CreatedAt}}">
            
            <div class="post-avatar">
                {{if .AvatarURL}}
                <img src="{{.AvatarURL}}" alt="avatar" class="post-avatar-img">
                {{else}}
                ⚔
                {{end}}
            </div>
            <div class="post-body">
                <h3><a href="/discussion?id={{.ID}}">{{.Title}}</a></h3>
                <p class="post-meta">Par <strong>{{.Author}}</strong></p>
                <p>{{.Content}}</p>
            </div>
        </div>
        {{else}}
        <div class="empty">
            Aucune discussion pour l'instant. —
            <a href="#" onclick="document.getElementById('NewDiscussionButton').click()">Crée la première.</a>
        </div>
        {{end}}
    </div>
</main>

<script src="/src/js/button.js"></script>
<script src="/src/js/live.js"></script>
<script>
function sortDiscussions(sortBy) {
    const posts = Array.from(document.querySelectorAll('#discussions-list > .post'));
    
    posts.sort((a, b) => {
        if (sortBy === 'likes') {
            const scoreA = parseInt(a.dataset.score) || 0;
            const scoreB = parseInt(b.dataset.score) || 0;
            return scoreB - scoreA; // décroissant
        } else if (sortBy === 'recent') {
            const dateA = new Date(a.dataset.created);
            const dateB = new Date(b.dataset.created);
            return dateB - dateA; // décroissant
        }
        return 0;
    });
    
    const container = document.getElementById('discussions-list');
    posts.forEach(post => container.appendChild(post));
}

document.getElementById('sort-filter').addEventListener('change', function() {
    sortDiscussions(this.value);
});

// Tri initial par likes
document.addEventListener('DOMContentLoaded', function() {
    sortDiscussions('likes');
});
</script>
</body>
</html>
