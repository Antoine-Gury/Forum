{{ define "content" }}
  <a class="btn" href="/thread/new">Créer un nouveau sujet</a>
  <ul class="threads">
    {{ range .Threads }}
      <li>
        <a href="/thread/view?id={{ .ID }}">{{ .Title }}</a>
        <small>{{ .Created.Format "2006-01-02 15:04" }}</small>
      </li>
    {{ else }}
      <li>Aucun sujet pour le moment.</li>
    {{ end }}
  </ul>
{{ end }}
