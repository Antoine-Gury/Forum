<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Confirmation en cours...</title>
    <link rel="stylesheet" href="/assets/css/login.css">
    <link rel="shortcut icon" type="image/png" href="/assets/Picture/Favicone.png">
    <style>
        .callback-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #FFD700;
            font-family: 'Cinzel', serif;
            text-align: center;
            gap: 1rem;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,215,0,0.2);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { color: #ff4d4d; font-size: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="spinner" id="spinner"></div>
        <p id="status-msg">Confirmation de ton compte en cours...</p>
        <p class="error-msg" id="error-msg">Une erreur est survenue. <a href="/login">Retour à la connexion</a></p>
    </div>

    <script>
        (function () {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);

            const accessToken  = params.get("access_token");
            const refreshToken = params.get("refresh_token") || "";
            const errorDesc    = params.get("error_description");

            if (errorDesc) {
                showError(decodeURIComponent(errorDesc.replace(/\+/g, " ")));
                return;
            }

            if (!accessToken) {
                showError("Token introuvable dans le lien de confirmation.");
                return;
            }

            const form = document.createElement("form");
            form.method = "POST";
            form.action = "/auth/callback/token";

            appendField(form, "access_token",  accessToken);
            appendField(form, "refresh_token", refreshToken);

            document.body.appendChild(form);
            form.submit();
        })();

        function appendField(form, name, value) {
            const input = document.createElement("input");
            input.type  = "hidden";
            input.name  = name;
            input.value = value;
            form.appendChild(input);
        }

        function showError(msg) {
            document.getElementById("spinner").style.display = "none";
            document.getElementById("status-msg").style.display = "none";
            const el = document.getElementById("error-msg");
            el.textContent = msg + " ";
            const link = document.createElement("a");
            link.href = "/login";
            link.textContent = "Retour à la connexion";
            el.appendChild(link);
            el.style.display = "block";
        }
    </script>
</body>
</html>
