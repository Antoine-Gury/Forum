<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} — Forum WoW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/index.css">
    <link rel="stylesheet" href="/assets/css/discussion.css">
    <link rel="stylesheet" href="/assets/css/Avatar.css">
    <link rel="stylesheet" href="/assets/css/vote.css">
    <link rel="shortcut icon" type="image/png" href="/assets/Picture/Favicone.png">
</head>
<body>

<header>
    <div class="logo">Forum WoW</div>
    <div class="tagline">Discussions de la communauté</div>
</header>

<nav class="main-nav">
    <button id="homeButton" class="Accueil-button" type="button">Accueil</button>
    <button id="NewDiscussionButton" class="Nouvelle-discussion-button" type="button">Nouvelle discussion</button>
    <button id="profileButton" class="Profil-button nav-right" type="button">Profil</button>
</nav>

<main>
    <div class="back-link-wrap">
        <a class="back-link" href="/">← Retour aux discussions</a>
    </div>

    <div class="discussion-card">
        <div class="discussion-top">
           <div class="vote-box">
                <form action="/vote" method="POST">
                    <input type="hidden" name="discussion_id" value="{{.ID}}">
                    <input type="hidden" name="value" value="1">
                    <input type="hidden" name="redirect" value="/discussion?id={{.ID}}">
                    <button class="vote-btn upvote {{if eq .UserVote 1}}active{{end}}" type="submit">▲</button>
                </form>
                <span class="vote-score">{{.Score}}</span>
                <form action="/vote" method="POST">
                    <input type="hidden" name="discussion_id" value="{{.ID}}">
                    <input type="hidden" name="value" value="-1">
                    <input type="hidden" name="redirect" value="/discussion?id={{.ID}}">
                    <button class="vote-btn downvote {{if eq .UserVote -1}}active{{end}}" type="submit">▼</button>
                </form>
            </div>
            <div class="discussion-avatar">
                {{if .AvatarURL}}
                <img src="{{.AvatarURL}}" alt="avatar" class="discussion-avatar-img">
                {{else}}
                ⚔
                {{end}}
            </div>
        </div>
        <h1 class="discussion-title">{{.Title}}</h1>
        <p class="discussion-meta">Posté par <strong>{{.Author}}</strong></p>
        <div class="discussion-content">{{.Content}}</div>
    </div>
</main>

<script src="/src/js/button.js"></script>
</body>
</html>
