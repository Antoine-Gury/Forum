<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forum simple</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Forum simple</h1>
    <nav>
      <a href="/">Accueil</a>
      <a href="/forum">Forum</a>
      <a href="/compte">Compte</a>
    </nav>
  </header>
  <main>
    {{ if eq .Page "home" }}
      {{ template "home" . }}
    {{ else if eq .Page "forum" }}
      {{ template "forum" . }}
    {{ else if eq .Page "compte" }}
      {{ template "compte" . }}
    {{ end }}
  </main>
  <footer>
    <p>Forum simple en Go</p>
  </footer>
</body>
</html>
